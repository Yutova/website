<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening Yutova...</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f2ed;
        color: #1d1c19;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        max-width: 360px;
        text-align: center;
        background: #fffdf8;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 18px;
        padding: 28px 22px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 10px;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #716c63;
        font-size: 15px;
      }
      a {
        color: #4a6b50;
        font-weight: 600;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Opening Yutova</h1>
      <p id="status">Redirecting you back to the app...</p>
      <p id="fallback" class="hidden">
        If nothing happened,
        <a id="open-app-link" href="#">open the app manually</a>.
      </p>
      <p id="error" class="hidden">
        This link is missing auth data. Request a new reset email from the app.
      </p>
    </main>
    <script>
      (function () {
        var pageParams = new URLSearchParams(window.location.search);
        // Default: production/dev build deep link.
        // For Expo Go testing, host this file with ?app=exp://.../--/auth-callback
        var APP_CALLBACK =
          pageParams.get("app") || "yutova://auth-callback";
        var hash = window.location.hash || "";
        var authParams = new URLSearchParams(
          hash ? hash.slice(1) : window.location.search.slice(1),
        );
        var hasAuthPayload =
          authParams.has("access_token") ||
          authParams.has("code") ||
          authParams.has("token_hash");

        if (!hasAuthPayload) {
          document.getElementById("status").className = "hidden";
          document.getElementById("error").className = "";
          return;
        }

        var appUrl = APP_CALLBACK + (hash || "#" + authParams.toString());

        document.getElementById("open-app-link").href = appUrl;
        window.location.replace(appUrl);

        window.setTimeout(function () {
          document.getElementById("fallback").className = "";
        }, 1800);
      })();
    </script>
  </body>
</html>
